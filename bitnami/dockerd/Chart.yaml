description: Delivers the Docker daemon to selected nodes as a DaemonSet instead of installing
  it on each of them. The daemon runs as a pure control plane - it drives the containerd that
  is already on the node rather than nesting one of its own - and publishes its socket at the
  usual host path, so anything on the node that expects Docker finds it there. An optional
  garbage collector reclaims the layer cache before it fills the node's disk.
