description: Turns Kubernetes nodes into OVN chassis that join an EXTERNAL OVN control
  plane. It runs ovn-controller (and, optionally, Open vSwitch) as a host-network
  DaemonSet and points it at a Southbound database you already operate - DevStack,
  OpenStack-Helm, a distro OVN, or an ovsdb-relay fan-out. It deploys no Northbound,
  no Southbound and no northd, so several Kubernetes clusters can share one OVN
  without any of them owning it.
