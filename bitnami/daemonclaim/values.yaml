## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass
##

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array
##
global:
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  ## Compatibility adaptations for Kubernetes platforms
  ##
  compatibility:
    ## Compatibility adaptations for Openshift
    ##
    openshift:
      ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
      ##
      adaptSecurityContext: auto

## @section Common parameters
##

## @param kubeVersion Override Kubernetes version
##
kubeVersion: ""
## @param nameOverride String to partially override common.names.fullname
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []
## Enable diagnostic mode in the deployment
##
diagnosticMode:
  ## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
  ##
  enabled: false
  ## @param diagnosticMode.command Command to override all containers in the deployment
  ##
  command:
    - sleep
  ## @param diagnosticMode.args Args to override all containers in the deployment
  ##
  args:
    - infinity

## @section Controller parameters
##

## daemonclaim image
## ref: https://github.com/fivetime/daemonclaim/pkgs/container/daemonclaim
## @param image.registry [default: ghcr.io] daemonclaim image registry
## @param image.repository [default: fivetime/daemonclaim] daemonclaim image repository
## @skip image.tag daemonclaim image tag (immutable tags are recommended)
## @param image.digest daemonclaim image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy daemonclaim image pull policy
## @param image.pullSecrets daemonclaim image pull secrets
##
image:
  registry: ghcr.io
  repository: fivetime/daemonclaim
  tag: 0.1.0-alpha.3
  digest: ""
  pullPolicy: IfNotPresent
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []
## @param replicaCount Number of controller replicas. Leader election makes more than one safe; only the leader reconciles, every replica serves the webhooks
##
replicaCount: 1
## @param leaderElection Enable leader election. Required for replicaCount > 1, harmless at 1
##
leaderElection: true
## @param logLevel Log verbosity: `info` or `debug`
##
logLevel: info
## @param extraArgs Extra arguments for the controller binary
##
extraArgs: []
## @param command Override the container command
## @param args Override the container args
##
command: []
args: []
## @param extraEnvVars Extra environment variables for the controller container
##
extraEnvVars: []
## @param extraEnvVarsCM Name of an existing ConfigMap with extra environment variables
## @param extraEnvVarsSecret Name of an existing Secret with extra environment variables
##
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

## @section Webhook parameters
## Two admission webhooks are what make this work: one rewrites the claimName of every pod a
## DaemonSet creates, the other validates DaemonClaims. Both need a serving certificate that
## the API server trusts.
##
webhook:
  ## @param webhook.port Port the webhook server listens on inside the pod
  ##
  port: 9443
  ## @param webhook.timeoutSeconds Admission timeout the API server allows each webhook
  ##
  timeoutSeconds: 10
  ## How the serving certificate is issued. Exactly one of these is used, in this order:
  ## certificate.existingSecret, certificate.certManager.enabled, certificate.autoGenerated.
  ##
  certificate:
    ## @param webhook.certificate.existingSecret Name of an existing TLS Secret with `tls.crt`, `tls.key` and `ca.crt`. The CA is what the API server is told to trust
    ##
    existingSecret: ""
    ## cert-manager issues and rotates the certificate, and injects the CA into the webhook
    ## configurations. This is the right choice on any cluster that has cert-manager.
    ##
    certManager:
      ## @param webhook.certificate.certManager.enabled Issue the certificate with cert-manager
      ##
      enabled: false
      ## @param webhook.certificate.certManager.issuerRef Reference to an existing Issuer or ClusterIssuer. Empty means a self-signed Issuer is created for this release
      ## e.g:
      ## issuerRef:
      ##   name: my-issuer
      ##   kind: ClusterIssuer
      ##   group: cert-manager.io
      ##
      issuerRef: {}
      ## @param webhook.certificate.certManager.duration Validity of the issued certificate
      ## @param webhook.certificate.certManager.renewBefore How long before expiry cert-manager renews it
      ##
      duration: 2160h
      renewBefore: 360h
    ## Helm generates a CA and a certificate at install time and keeps them across upgrades.
    ## Nothing rotates them, which is why the validity is long: a webhook whose certificate
    ## expired refuses every DaemonSet pod that opted in.
    ##
    autoGenerated:
      ## @param webhook.certificate.autoGenerated.validityDays Validity, in days, of the generated CA and certificate
      ##
      validityDays: 3650
  ## @param webhook.failurePolicy What the API server does when the webhook cannot be reached. `Fail` refuses opted-in pods, which is loud and safe; `Ignore` admits them with a placeholder claimName that every node's pod would then share
  ##
  failurePolicy: Fail

## @section RBAC and ServiceAccount parameters
##

## @param rbac.create Create the ClusterRole, Role and bindings the controller needs
##
rbac:
  create: true
## ServiceAccount configuration
## @param serviceAccount.create Specifies whether a ServiceAccount should be created
## @param serviceAccount.name The name of the ServiceAccount to use. If not set and create is true, a name is generated using the common.names.fullname template
## @param serviceAccount.annotations Additional Service Account annotations (evaluated as a template)
## @param serviceAccount.automountServiceAccountToken Automount service account token for the server service account
##
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

## @section Metrics parameters
##
metrics:
  ## @param metrics.enabled Serve Prometheus metrics: controller-runtime's own plus `daemonclaim_claims`, `daemonclaim_webhook_rewrites_total` and `daemonclaim_retention_decisions_total`
  ##
  enabled: true
  ## @param metrics.port Port the metrics endpoint listens on inside the pod
  ##
  port: 8080
  ## Metrics service
  ##
  service:
    ## @param metrics.service.enabled Create a Service for the metrics endpoint
    ## @param metrics.service.type Metrics Service type
    ## @param metrics.service.port Metrics Service port
    ## @param metrics.service.annotations Annotations for the metrics Service
    ##
    enabled: true
    type: ClusterIP
    port: 8080
    annotations: {}
  ## Prometheus Operator ServiceMonitor configuration
  ##
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a ServiceMonitor (requires the Prometheus Operator CRDs)
    ## @param metrics.serviceMonitor.namespace Namespace for the ServiceMonitor. Defaults to the release namespace
    ## @param metrics.serviceMonitor.interval Scrape interval
    ## @param metrics.serviceMonitor.scrapeTimeout Scrape timeout
    ## @param metrics.serviceMonitor.labels Additional labels, e.g. for the Prometheus instance's serviceMonitorSelector
    ## @param metrics.serviceMonitor.relabelings RelabelConfigs to apply to samples before scraping
    ## @param metrics.serviceMonitor.metricRelabelings MetricRelabelConfigs to apply to samples before ingestion
    ## @param metrics.serviceMonitor.honorLabels Honor metrics labels
    ## @param metrics.serviceMonitor.jobLabel The name of the label on the target service to use as the job name in Prometheus
    ##
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    labels: {}
    relabelings: []
    metricRelabelings: []
    honorLabels: false
    jobLabel: ""

## @section Deployment parameters
##

## @param updateStrategy.type Deployment strategy type
## @param updateStrategy.rollingUpdate Deployment rolling update configuration parameters
##
updateStrategy:
  type: RollingUpdate
  rollingUpdate: {}
## @param revisionHistoryLimit Number of old ReplicaSets to retain
##
revisionHistoryLimit: 10
## @param podLabels Extra labels for controller pods
## @param podAnnotations Annotations for controller pods
##
podLabels: {}
podAnnotations: {}
## @param automountServiceAccountToken Mount the ServiceAccount token in the pod. The controller talks to the API server, so it needs one
##
automountServiceAccountToken: true
## @param hostAliases Deployment pod host aliases
##
hostAliases: []
## @param priorityClassName Priority class for the controller pods. The webhook sits in the admission path of every opted-in DaemonSet, so it should not be the first thing evicted
##
priorityClassName: ""
## @param schedulerName Name of the Kubernetes scheduler to use
##
schedulerName: ""
## @param topologySpreadConstraints Topology spread constraints for the controller pods
##
topologySpreadConstraints: []
## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
##
podAffinityPreset: ""
podAntiAffinityPreset: soft
## Node affinity preset
## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set
## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set
##
nodeAffinityPreset:
  type: ""
  key: ""
  values: []
## @param affinity Affinity for pod assignment. Evaluated as a template
##
affinity: {}
## @param nodeSelector Node labels for pod assignment. Evaluated as a template
##
nodeSelector: {}
## @param tolerations Tolerations for pod assignment. Evaluated as a template
##
tolerations: []
## @param terminationGracePeriodSeconds Seconds the controller pod is given to stop
##
terminationGracePeriodSeconds: 10
## Pod-level security context
## @param podSecurityContext.enabled Enable pod security context
## @param podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
## @param podSecurityContext.sysctls Set kernel settings using the sysctl interface
## @param podSecurityContext.supplementalGroups Set filesystem extra groups
## @param podSecurityContext.fsGroup Group ID for the pod's volumes
##
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 65532
## Container security context. The image is distroless and runs as user 65532; nothing here
## needs to be relaxed.
## @param containerSecurityContext.enabled Enable container security context
## @param containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
## @param containerSecurityContext.runAsUser User ID for the container
## @param containerSecurityContext.runAsGroup Group ID for the container
## @param containerSecurityContext.runAsNonRoot Run container as non-root
## @param containerSecurityContext.privileged Run container as privileged
## @param containerSecurityContext.readOnlyRootFilesystem Mount the container root filesystem read-only
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation
## @param containerSecurityContext.capabilities.drop Linux capabilities to drop
## @param containerSecurityContext.seccompProfile.type Seccomp profile type
##
containerSecurityContext:
  enabled: true
  seLinuxOptions: {}
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
## @param resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if resources is set (resources is recommended for production).
## @param resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
##
resourcesPreset: "nano"
resources: {}
## Probes use controller-runtime's /healthz and /readyz.
## @param livenessProbe.enabled Enable livenessProbe
## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
## @param livenessProbe.periodSeconds Period seconds for livenessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
## @param livenessProbe.successThreshold Success threshold for livenessProbe
##
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
## @param readinessProbe.enabled Enable readinessProbe
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
## @param readinessProbe.successThreshold Success threshold for readinessProbe
##
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
## @param startupProbe.enabled Enable startupProbe
## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
## @param startupProbe.periodSeconds Period seconds for startupProbe
## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
## @param startupProbe.failureThreshold Failure threshold for startupProbe
## @param startupProbe.successThreshold Success threshold for startupProbe
##
startupProbe:
  enabled: false
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 12
  successThreshold: 1
## @param customLivenessProbe Custom livenessProbe that overrides the default one
## @param customReadinessProbe Custom readinessProbe that overrides the default one
## @param customStartupProbe Custom startupProbe that overrides the default one
##
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}
## @param lifecycleHooks Lifecycle hooks for the controller container
##
lifecycleHooks: {}
## @param extraVolumes Extra volumes for the controller pod
## @param extraVolumeMounts Extra volume mounts for the controller container
##
extraVolumes: []
extraVolumeMounts: []
## @param sidecars Extra sidecar containers for the controller pod
## @param initContainers Extra init containers for the controller pod
##
sidecars: []
initContainers: []
## Pod Disruption Budget
## @param pdb.create Create a PodDisruptionBudget. Only meaningful with replicaCount > 1
## @param pdb.minAvailable Minimum number/percentage of pods that must remain available
## @param pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable. Defaults to `1` if both this and `pdb.minAvailable` are empty
##
pdb:
  create: true
  minAvailable: ""
  maxUnavailable: ""
