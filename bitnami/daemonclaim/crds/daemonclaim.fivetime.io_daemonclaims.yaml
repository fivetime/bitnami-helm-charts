              persistentVolumeClaimRetentionPolicy:
                description: |-
                  PersistentVolumeClaimRetentionPolicy governs what happens to the claims
                  when the DaemonSet is deleted or a node leaves it. Both default to
                  Retain.
                properties:
                  unscheduledGracePeriod:
                    default: 30m
                    description: |-
                      UnscheduledGracePeriod is how long a node must have had no pod of the
                      DaemonSet before WhenUnscheduled=Delete may act, so that a rollout or an
                      eviction is never mistaken for the node leaving. A deleted Node object
                      is acted on immediately. Minimum 5m, default 30m.
                    type: string
                  whenDeleted:
                    default: Retain
                    description: |-
                      WhenDeleted is applied when the DaemonSet is deleted. Retain leaves the
                      claims in place with nothing owning them; Delete makes the DaemonSet
                      their owner so garbage collection removes them with it.
                    enum:
                    - Retain
                    - Delete
                    type: string
                  whenUnscheduled:
                    default: Retain
                    description: |-
                      WhenUnscheduled is applied when a node no longer runs a pod of the
                      DaemonSet: it stopped matching the DaemonSet's selection, or the Node
                      object was deleted. A pod that is merely being replaced during a rollout
                      does not count; see UnscheduledGracePeriod.
                    enum:
                    - Retain
                    - Delete
                    type: string
