## Headless service used when a per-pod stable identity is needed (e.g. external consistent-hash LB targeting pods)
headless:
  ## @param headless.annotations Annotations for the headless service
  ##
  annotations: {}

ingress:
  ## @param ingress.enabled Enable ingress record generation for the S3 API
  ##
  enabled: false
  ## @param ingress.pathType Ingress path type
  ##
  pathType: ImplementationSpecific
  ## @param ingress.hostname Default host for the ingress record
  ##
  hostname: s3.local
  ## @param ingress.ingressClassName IngressClass that will be used to implement the Ingress
  ##
  ingressClassName: ""
  ## @param ingress.path Default path for the ingress record
  ##
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource. For per-object-key consistent-hash routing with the NGINX Ingress Controller, set nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
  ##
  annotations: {}
  ## @param ingress.tls Enable TLS configuration for the host defined at ingress.hostname
  ##
  tls: false
  ## @param ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates generated by Helm
  ##
  selfSigned: false
  ## @param ingress.extraHosts An array with additional hostname(s) to be covered with the ingress record
  ##
  extraHosts: []
  ## @param ingress.extraTls The tls configuration for additional hostnames to be covered with this ingress record
  ##
  extraTls: []
  ## @param ingress.secrets Custom TLS certificates as secrets
  ##
  secrets: []
  ## @param ingress.extraRules Additional rules to be covered with this ingress record
  ##
  extraRules: []

## @section Other parameters

## @param pdb.create Enable a Pod Disruption Budget so rolling upgrades keep the gateway available
## @param pdb.minAvailable Minimum number/percentage of pods that must be available
## @param pdb.maxUnavailable Maximum number/percentage of pods that may be unavailable (defaults to 1 when minAvailable is unset)
##
pdb:
  create: true
  minAvailable: ""
  maxUnavailable: ""

## Horizontal Pod Autoscaler
## @param autoscaling.enabled Enable Horizontal POD autoscaling for the gateway
## @param autoscaling.minReplicas Minimum number of gateway replicas
## @param autoscaling.maxReplicas Maximum number of gateway replicas
## @param autoscaling.targetCPU Target CPU utilization percentage
## @param autoscaling.targetMemory Target Memory utilization percentage
##
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPU: 70
  targetMemory: ""

serviceAccount:
  ## @param serviceAccount.create Enable creation of a ServiceAccount for the gateway pods
  ##
  create: true
  ## @param serviceAccount.name Name of the created ServiceAccount. Generated when empty and create is true
  ##
  name: ""
  ## @param serviceAccount.annotations Additional custom annotations for the ServiceAccount
  ##
  annotations: {}
  ## @param serviceAccount.automountServiceAccountToken Auto-mount the ServiceAccount token
  ##
  automountServiceAccountToken: false

networkPolicy:
  ## @param networkPolicy.enabled Enable creation of NetworkPolicy resources
  ##
  enabled: true
  ## @param networkPolicy.allowExternal The Policy model to apply. When false, only pods with the correct client label can reach the S3 port
  ##
  allowExternal: true
  ## @param networkPolicy.allowExternalEgress Allow the pods to access any range of ports and hosts for egress
  ##
  allowExternalEgress: true
  ## @param networkPolicy.extraIngress Add extra ingress rules to the NetworkPolicy
  ##
  extraIngress: []
  ## @param networkPolicy.extraEgress Add extra egress rules to the NetworkPolicy
  ##
  extraEgress: []

