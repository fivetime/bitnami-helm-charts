{{- if .Values.sharedResources.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubetron.webhook.serviceName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: manager
  {{- if or .Values.service.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.service.annotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.clusterIP (eq .Values.service.type "ClusterIP") }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  # Functional selector (not app.kubernetes.io/instance): this shared Service fronts the
  # manager pods of EVERY release that shares this control plane (one release per Neutron/OVN
  # cluster). The webhook serves all shards, so it may hit any manager pod.
  selector:
    kubetron.network.kubevirt.io/control-plane: {{ include "kubetron.controlPlaneName" . | quote }}
    app.kubernetes.io/component: manager
  ports:
    - name: webhook
      port: {{ .Values.service.ports.webhook }}
      targetPort: webhook
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
    {{- if .Values.service.extraPorts }}
    {{- include "common.tplvalues.render" (dict "value" .Values.service.extraPorts "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
