description: Gives DaemonSets the per-node PersistentVolumeClaims that StatefulSets get from
  volumeClaimTemplates. A DaemonClaim names a DaemonSet and a claim template; every node the
  DaemonSet runs on gets its own claim, the pod on that node is pointed at it when it is
  created, and the claim outlives pod restarts and rollouts under an explicit retention policy.
  Works with any StorageClass that binds on first consumer.
