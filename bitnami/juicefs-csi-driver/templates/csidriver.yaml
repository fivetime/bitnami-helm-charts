apiVersion: {{ ternary "storage.k8s.io/v1" "storage.k8s.io/v1beta1" (semverCompare ">=1.18.0-0" (include "common.capabilities.kubeVersion" .)) }}
kind: CSIDriver
metadata:
  name: {{ include "juicefs-csi.driverName" . }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
  annotations:
    {{- if not .Values.csidriver.disableHooks }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
    helm.sh/resource-policy: keep
    {{- if .Values.csidriver.annotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.csidriver.annotations "context" .) | nindent 4 }}
    {{- end }}
spec:
  attachRequired: false
  podInfoOnMount: true
