  ##
  type: ClusterIP
  ## @param service.ports.api S3 API service port
  ## @param service.ports.metrics Metrics service port
  ##
  ports:
    api: 9000
    metrics: 9567
  ## @param service.nodePorts.api Node port for the S3 API (when type is NodePort/LoadBalancer)
  ##
  nodePorts:
    api: ""
  ## @param service.clusterIP S3 API service cluster IP
  ##
  clusterIP: ""
  ## @param service.loadBalancerIP S3 API service Load Balancer IP
  ##
  loadBalancerIP: ""
  ## @param service.loadBalancerSourceRanges S3 API service Load Balancer sources
  ##
  loadBalancerSourceRanges: []
  ## @param service.externalTrafficPolicy S3 API service external traffic policy
  ##
  externalTrafficPolicy: Cluster
  ## @param service.annotations Additional custom annotations for the S3 API service
  ##
  annotations: {}
  ## @param service.extraPorts Extra ports to expose in the S3 API service
  ##
  extraPorts: []
  ## @param service.sessionAffinity Session Affinity for Kubernetes service, can be "None" or "ClientIP"
  ##
