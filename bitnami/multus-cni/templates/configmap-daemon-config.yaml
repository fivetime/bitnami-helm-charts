{{- if eq .Values.mode "thick" }}
{{- $config := deepCopy .Values.thick.daemonConfig -}}
{{- $hostRunDir := trimSuffix "/" .Values.thick.hostRunDir -}}
{{- $hostRunMountPath := trimSuffix "/" .Values.thick.hostRunMountPath -}}
{{- $socketDir := trimSuffix "/" $config.socketDir -}}
{{- $socketPrefix := printf "%s/" $hostRunMountPath -}}
{{- if not (hasPrefix $socketPrefix $socketDir) -}}
{{- fail "thick.daemonConfig.socketDir must be a child of thick.hostRunMountPath; multus-daemon removes and recreates the socket directory during startup" -}}
{{- end -}}
{{- $socketRelativePath := trimPrefix $socketPrefix $socketDir -}}
{{- $_ := set $config "daemonSocketDir" (printf "%s/%s/" $hostRunDir $socketRelativePath) -}}
{{- if .Values.metrics.enabled }}
{{- $_ := set $config "metricsPort" (int .Values.metrics.port) -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-daemon-config
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  daemon-config.json: |-
{{ $config | toPrettyJson | indent 4 }}
{{- end }}
