apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
  {{- if .Values.updateStrategy }}
  updateStrategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
      {{- if .Values.podAnnotations }}
      annotations: {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
      {{- end }}
    spec:
      {{- include "userspace-cni.imagePullSecrets" . | nindent 6 }}
      hostNetwork: true
      serviceAccountName: {{ include "userspace-cni.serviceAccountName" . }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "customLabels" $podLabels "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "customLabels" $podLabels "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- /* The kubeconfig generator needs the SA token; it is provided via an explicit
             projected volume below (works even where automatic mounting is disabled). */}}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.initContainers }}
        {{- include "common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 8 }}
        {{- end }}
        # Installs the userspace CNI binary onto the host CNI bin dir. The node
        # runtime (kubelet) invokes it per-Pod from there; this container does
        # not run the CNI itself.
        - name: install-cni
          image: {{ template "userspace-cni.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
          args:
            - {{ include "userspace-cni.installCommand" . | quote }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: "10m"
              memory: "15Mi"
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cnibin
              mountPath: {{ printf "%s%s" .Values.CNIMountPath (include "userspace-cni.cniBinDir" .) }}
      containers:
        # When kubeconfig.enabled, this container generates the on-host kubeconfig
        # the userspace CNI binary uses to reach the API, and refreshes it. Otherwise
        # it just keeps the DaemonSet Pod Running (a DaemonSet needs >=1 container).
        - name: userspace-cni
          image: {{ template "userspace-cni.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          {{- if .Values.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          {{- end }}
          {{- else if .Values.kubeconfig.enabled }}
          command:
            - /bin/sh
            - /scripts/gen-kubeconfig.sh
          {{- else }}
          command:
            - /bin/sh
            - -c
            - "trap 'exit 0' TERM; while true; do sleep 3600 & wait $!; done"
          {{- end }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if or .Values.kubeconfig.enabled .Values.extraEnvVars }}
          env:
            {{- if .Values.kubeconfig.enabled }}
            - name: KUBECONFIG_DIR
              value: {{ printf "%s%s/%s" .Values.CNIMountPath .Values.kubeconfig.hostCNIConfDir .Values.kubeconfig.subDir | quote }}
            - name: KUBECONFIG_FILE
              value: {{ .Values.kubeconfig.fileName | quote }}
            - name: REFRESH_INTERVAL
              value: {{ .Values.kubeconfig.refreshInterval | quote }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne .Values.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            {{- if .Values.kubeconfig.enabled }}
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: cni-conf-dir
              mountPath: {{ printf "%s%s" .Values.CNIMountPath .Values.kubeconfig.hostCNIConfDir | quote }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.restoreDaemon.enabled }}
        # Per-node restore daemon: watches the node VPP and re-asserts this node's
        # memif masters on (re)connect (VPP's runtime state is non-persistent, so a
        # VPP restart drops them). Uses the in-cluster ServiceAccount. VPP only.
        - name: restore-daemon
          image: {{ template "userspace-cni.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - /userspace-daemon
            - --vpp-api-socket={{ .Values.restoreDaemon.vppApiSocket }}
            - --socket-prefix={{ .Values.restoreDaemon.socketPrefix }}
            - --metrics-addr=:{{ .Values.restoreDaemon.metricsPort }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http-metrics
              containerPort: {{ .Values.restoreDaemon.metricsPort }}
              protocol: TCP
          # Liveness only checks the process is responsive (/healthz is always 200).
          # Deliberately NO readiness gate on VPP connectivity: the daemon must
          # tolerate the dataplane being down — or absent on a node (e.g. a network
          # node with no VPP) — and simply wait to reconnect. Gating readiness on the
          # VPP connection would couple userspace-cni's rollout to VPP's lifecycle and
          # deadlock the DaemonSet on any VPP-less node. The live connection state is
          # still exposed via /readyz and /metrics for monitoring.
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.restoreDaemon.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- if .Values.restoreDaemon.resources }}
          resources: {{- toYaml .Values.restoreDaemon.resources | nindent 12 }}
          {{- end }}
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: vpp-run
              mountPath: /run/vpp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- end }}
        {{- if .Values.sidecars }}
        {{- include "common.tplvalues.render" (dict "value" .Values.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: empty-dir
          emptyDir: {}
        - name: cnibin
          hostPath:
            path: {{ include "userspace-cni.cniBinDir" . }}
            type: DirectoryOrCreate
        {{- if .Values.kubeconfig.enabled }}
        - name: scripts
          configMap:
            name: {{ printf "%s-scripts" (include "common.names.fullname" .) }}
            defaultMode: 0555
        - name: cni-conf-dir
          hostPath:
            path: {{ .Values.kubeconfig.hostCNIConfDir | quote }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if or .Values.kubeconfig.enabled .Values.restoreDaemon.enabled }}
        # SA token + CA for the on-host CNI binary's kubeconfig and/or the
        # restore daemon's in-cluster client.
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.kubeconfig.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        {{- if .Values.restoreDaemon.enabled }}
        - name: vpp-run
          hostPath:
            path: {{ .Values.restoreDaemon.hostVppRunDir | quote }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
