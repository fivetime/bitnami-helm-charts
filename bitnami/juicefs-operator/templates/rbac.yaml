{{- if .Values.rbac.create }}
{{- /*
  Rules are reproduced faithfully from the upstream juicefs-operator chart:
  the controller cannot function without exactly these permissions. Only the
  naming/labels are adapted to the Bitnami framework.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "common.names.fullname" . }}-leader-election
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "common.names.fullname" . }}-manager
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, secrets]
    verbs: [create, delete, get, list, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, deletecollection, get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [create, delete, get, list, update, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, update, watch]
  - apiGroups: [juicefs.io]
    resources: [cachegroups, cronsyncs, syncs, warmups]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [juicefs.io]
    resources: [cachegroups/finalizers, cronsyncs/finalizers, syncs/finalizers, warmups/finalizers]
    verbs: [update]
  - apiGroups: [juicefs.io]
    resources: [cachegroups/status, cronsyncs/status, syncs/status, warmups/status]
    verbs: [get, patch, update]
  {{- if .Values.dashboard.enabled }}
  - apiGroups: [""]
    resources: [persistentvolumes, persistentvolumeclaims, persistentvolumeclaims/status]
    verbs: [get, list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "common.names.fullname" . }}-leader-election
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "common.names.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "juicefs-operator.serviceAccountName" . }}
    namespace: {{ include "common.names.namespace" . | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "common.names.fullname" . }}-manager
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "common.names.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "juicefs-operator.serviceAccountName" . }}
    namespace: {{ include "common.names.namespace" . | quote }}
{{- end }}
