{{- /*
Copyright Broadcom, Inc. All Rights Reserved.
SPDX-License-Identifier: APACHE-2.0

Node DaemonSet for mountpod/process mode. The privileged host access, kubelet
registration hostPaths, and bidirectional mount propagation are reproduced
faithfully from upstream; only naming/labels and image helpers are adapted to
the Bitnami framework.
*/}}

{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ printf "%s-node" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/component: node
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.node.updateStrategy }}
  updateStrategy: {{- toYaml .Values.node.updateStrategy | nindent 4 }}
  {{- end }}
  {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.node.podLabels .Values.commonLabels) "context" .) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" (dict "customLabels" $podLabels "context" .) | nindent 6 }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels: {{- include "common.labels.standard" (dict "customLabels" $podLabels "context" .) | nindent 8 }}
        app.kubernetes.io/component: node
      {{- if .Values.node.podAnnotations }}
      annotations: {{- include "common.tplvalues.render" (dict "value" .Values.node.podAnnotations "context" .) | nindent 8 }}
      {{- end }}
    spec:
      {{- include "juicefs-csi.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "juicefs-csi.node.serviceAccountName" . }}
      priorityClassName: {{ .Values.node.priorityClassName }}
      {{- if .Values.node.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.node.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.node.affinity "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.node.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.node.nodeSelector "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.node.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.node.tolerations "context" .) | nindent 8 }}
      {{- end }}
      containers:
        - name: juicefs-plugin
          image: {{ include "juicefs-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --logtostderr
            - --nodeid=$(NODE_NAME)
            {{- if .Values.node.debug }}
            - --v=1
            {{- end }}
            {{- if eq .Values.mountMode "mountpod" }}
            - --enable-manager=true
            {{- end }}
            {{- if eq .Values.mountMode "process" }}
            - --by-process=true
            {{- end }}
            {{- if .Values.globalConfig.enabled }}
            - --config=/etc/config/config.yaml
            {{- end }}
          env:
            - name: CSI_ENDPOINT
              value: unix:/csi/csi.sock
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if ne .Values.mountMode "process" }}
            - name: JUICEFS_MOUNT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.node.ifPollingKubelet }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: KUBELET_PORT
              value: "10250"
            {{- end }}
            - name: JUICEFS_MOUNT_PATH
              value: {{ .Values.jfsMountDir }}
            - name: JUICEFS_CONFIG_PATH
              value: {{ .Values.jfsConfigDir }}
            {{- if .Values.node.mountPodNonPreempting }}
            - name: JUICEFS_MOUNT_PRIORITY_NAME
              value: "juicefs-mount-priority-nonpreempting"
            - name: JUICEFS_MOUNT_PREEMPTION_POLICY
              value: "Never"
            {{- end }}
            {{- if .Values.defaultMountImage.ce }}
            - name: JUICEFS_CE_MOUNT_IMAGE
              value: {{ .Values.defaultMountImage.ce | quote }}
            {{- end }}
            {{- if .Values.defaultMountImage.ee }}
            - name: JUICEFS_EE_MOUNT_IMAGE
              value: {{ .Values.defaultMountImage.ee | quote }}
            {{- end }}
            {{- end }}
            - name: JUICEFS_CSI_WEB_PORT
              value: {{ .Values.controller.metricsPort | quote }}
            - name: DRIVER_NAME
              value: {{ include "juicefs-csi.driverName" . | quote }}
            {{- if .Values.node.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.node.extraEnvVars "context" .) | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9909
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          ports:
            - containerPort: 9909
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.controller.metricsPort }}
              protocol: TCP
          # CSI node plugin requires privileged host access to mount volumes.
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsNonRoot: false
          {{- if .Values.node.resources }}
          resources: {{- toYaml .Values.node.resources | nindent 12 }}
          {{- else if ne .Values.node.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.node.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: kubelet-dir
              mountPath: {{ .Values.kubeletDir }}
              mountPropagation: Bidirectional
            - name: plugin-dir
              mountPath: /csi
            - name: device-dir
              mountPath: /dev
            {{- if ne .Values.mountMode "process" }}
            - name: jfs-dir
              mountPath: /jfs
              mountPropagation: Bidirectional
            - name: jfs-root-dir
              mountPath: /root/.juicefs
              mountPropagation: Bidirectional
            - name: jfs-fuse-fd
              mountPath: /tmp
            {{- end }}
            {{- if .Values.globalConfig.enabled }}
            - name: juicefs-config
              mountPath: /etc/config
            {{- end }}
        - name: node-driver-registrar
          image: {{ include "juicefs-csi.sidecarImage" (dict "root" .Values.sidecars.nodeDriverRegistrarImage "global" .Values.global) }}
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --v={{ .Values.node.driverRegistrarLogLevel }}
            - --health-port=9809
          ports:
            - name: healthz
              containerPort: 9809
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            timeoutSeconds: 5
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: {{ .Values.kubeletDir }}/csi-plugins/{{ include "juicefs-csi.driverName" . }}/csi.sock
          securityContext:
            privileged: {{ .Values.node.sidecarPrivileged }}
            runAsNonRoot: false
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: {{ include "juicefs-csi.sidecarImage" (dict "root" .Values.sidecars.livenessProbeImage "global" .Values.global) }}
          args:
            - --csi-address=$(ADDRESS)
            - --health-port=$(HEALTH_PORT)
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: HEALTH_PORT
              value: "9909"
          securityContext:
            privileged: {{ .Values.node.sidecarPrivileged }}
            runAsNonRoot: false
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.kubeletDir }}
            type: Directory
        - name: plugin-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/csi-plugins/{{ include "juicefs-csi.driverName" . }}/
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/plugins_registry/
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
        {{- if ne .Values.mountMode "process" }}
        - name: jfs-dir
          hostPath:
            path: {{ .Values.jfsMountDir }}
            type: DirectoryOrCreate
        - name: jfs-root-dir
          hostPath:
            path: {{ .Values.jfsConfigDir }}
            type: DirectoryOrCreate
        - name: jfs-fuse-fd
          hostPath:
            path: /var/run/juicefs-csi
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.globalConfig.enabled }}
        - name: juicefs-config
          configMap:
            name: {{ printf "%s-config" (include "common.names.fullname" .) }}
        {{- end }}
{{- end }}
