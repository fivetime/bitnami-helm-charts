{{- if (include "juicefs-s3-gateway.createSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  # common.secrets.passwords.manage already returns a base64-encoded value; do NOT b64enc or quote it (matches bitnami/minio pattern)
  root-user: {{ include "juicefs-s3-gateway.rootUserValue" . }}
  root-password: {{ include "juicefs-s3-gateway.rootPasswordValue" . }}
  meta-url: {{ .Values.auth.metaUrl | required "auth.metaUrl is required when not using an existing secret" | b64enc | quote }}
{{- end }}
{{- if and .Values.bucketAdmin.enabled (not .Values.bucketAdmin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
    app.kubernetes.io/component: bucket-admin
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.bucketAdmin.tokenSecretKey }}: {{ required "bucketAdmin.token is required when bucketAdmin is enabled without an existing secret" .Values.bucketAdmin.token | b64enc | quote }}
{{- end }}
