{{- /*
The Secret and both webhook configurations live in one file on purpose. When Helm
generates the certificate, the CA has to be the same bytes in the Secret and in every
caBundle; templates in separate files are rendered independently and would each generate
their own.
*/}}
{{- $svc := include "daemonclaim.webhook.serviceName" . }}
{{- $ns := include "common.names.namespace" . }}
{{- $secretName := include "daemonclaim.webhook.secretName" . }}
{{- $caBundle := "" }}
{{- if include "daemonclaim.webhook.autoGenerate" . }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $crt := "" }}{{- $key := "" }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") (index $existing.data "tls.crt") (index $existing.data "tls.key") }}
{{- /* keep what a previous release generated; a new CA would invalidate the running certificate */}}
{{- $caBundle = index $existing.data "ca.crt" }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $days := int .Values.webhook.certificate.autoGenerated.validityDays }}
{{- $ca := genCA (printf "%s-ca" $svc) $days }}
{{- $altNames := list $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
{{- $cert := genSignedCert $svc nil $altNames $days $ca }}
{{- $caBundle = $ca.Cert | b64enc }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caBundle }}
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
---
{{- else if include "daemonclaim.webhook.useCertManager" . }}
{{- if not .Values.webhook.certificate.certManager.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ printf "%s-selfsigned" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $ns | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "daemonclaim.webhook.certificateName" . }}
  namespace: {{ $ns | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ $secretName }}
  duration: {{ .Values.webhook.certificate.certManager.duration }}
  renewBefore: {{ .Values.webhook.certificate.certManager.renewBefore }}
  dnsNames:
    - {{ $svc }}
    - {{ printf "%s.%s" $svc $ns }}
    - {{ printf "%s.%s.svc" $svc $ns }}
    - {{ printf "%s.%s.svc.cluster.local" $svc $ns }}
  issuerRef:
    {{- if .Values.webhook.certificate.certManager.issuerRef }}
    {{- toYaml .Values.webhook.certificate.certManager.issuerRef | nindent 4 }}
    {{- else }}
    name: {{ printf "%s-selfsigned" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
    kind: Issuer
    {{- end }}
---
{{- else }}
{{- /* existingSecret: the CA the API server must trust is that Secret's ca.crt */}}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") }}
{{- $caBundle = index $existing.data "ca.crt" }}
{{- end }}
{{- end }}
{{- $certManagerAnnotation := dict }}
{{- if include "daemonclaim.webhook.useCertManager" . }}
{{- $_ := set $certManagerAnnotation "cert-manager.io/inject-ca-from" (printf "%s/%s" $ns (include "daemonclaim.webhook.certificateName" .)) }}
{{- end }}
{{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list $certManagerAnnotation .Values.commonAnnotations ) "context" . ) }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "common.names.fullname.namespace" . }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if $annotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
webhooks:
  - name: pod.daemonclaim.fivetime.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    # Only pods that opted in reach the webhook. That is what makes failurePolicy Fail
    # acceptable: when the webhook is down, only DaemonSets that asked for daemonclaim stop
    # creating pods, and nothing else in the cluster is touched.
    objectSelector:
      matchLabels:
        daemonclaim.fivetime.io/enabled: "true"
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /mutate--v1-pod
        port: 443
      {{- if $caBundle }}
      caBundle: {{ $caBundle }}
      {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "common.names.fullname.namespace" . }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if $annotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
webhooks:
  - name: validate.daemonclaim.fivetime.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    rules:
      - apiGroups: [daemonclaim.fivetime.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [daemonclaims]
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /validate-daemonclaim-fivetime-io-v1alpha1-daemonclaim
        port: 443
      {{- if $caBundle }}
      caBundle: {{ $caBundle }}
      {{- end }}
