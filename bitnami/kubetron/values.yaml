## @section CRD parameters
##

crds:
  ## @param crds.install Install the NetworkPortClaim CustomResourceDefinition. Disable this when running the aggregated apiserver (`apiserver.enabled=true`), which serves the resource instead of a CRD.
  ##
  install: true
  ## @param crds.keep Keep the CRD on `helm uninstall` (adds the helm.sh/resource-policy: keep annotation) to protect existing NetworkPortClaims
  ##
  keep: true
## @section Aggregated apiserver parameters (advanced, opt-in)
##

## The aggregated apiserver serves NetworkPortClaims from kubetron's OWN etcd instead of
## a CRD in the main cluster's etcd — an opt-in for very large deployments where claim
## storage and watch fan-out should leave the core apiserver (see DESIGN §10.5). Switching
## a live cluster from the CRD to the apiserver is a deliberate data migration; do not flip
## `crds.install`/`apiserver.enabled` on an in-use cluster without following that procedure.
##
apiserver:
  ## @param apiserver.enabled Deploy the aggregated apiserver (and its etcd) instead of relying on the CRD
  ##
  enabled: false
  ## @param apiserver.replicaCount Number of aggregated apiserver replicas
  ##
  replicaCount: 2
  ## @param apiserver.groupPriorityMinimum APIService group priority minimum
  ## @param apiserver.versionPriority APIService version priority
  ##
  groupPriorityMinimum: 1000
  versionPriority: 15
  ## @param apiserver.containerPort Aggregated apiserver HTTPS container port
  ##
  containerPort: 8443
  ## @param apiserver.extraArgs Additional raw args appended to the apiserver container
  ##
  extraArgs: []
  ## @param apiserver.command Override default apiserver container command
  ##
  command: []
  ## @param apiserver.args Override default apiserver container args
  ##
  args: []
  ## @param apiserver.resourcesPreset Set apiserver container resources according to one common preset. Ignored if `apiserver.resources` is set.
  ## @param apiserver.resources Set apiserver container requests and limits
  ##
  resourcesPreset: "small"
  resources: {}
  ## Aggregated apiserver probes (kube-apiserver /livez and /readyz)
  ## @param apiserver.livenessProbe.enabled Enable livenessProbe on the apiserver container
  ## @param apiserver.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param apiserver.livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param apiserver.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param apiserver.livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param apiserver.livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  ## @param apiserver.readinessProbe.enabled Enable readinessProbe on the apiserver container
  ## @param apiserver.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param apiserver.readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param apiserver.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param apiserver.readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param apiserver.readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  ## @param apiserver.podAntiAffinityPreset Pod anti-affinity preset for the apiserver. Ignored if `apiserver.affinity` is set.
  ##
  podAntiAffinityPreset: soft
  ## @param apiserver.nodeSelector Node labels for apiserver pod assignment
  ##
  nodeSelector:
    kubernetes.io/os: linux
  ## @param apiserver.tolerations Tolerations for apiserver pod assignment
  ##
  tolerations: []
  ## @param apiserver.affinity Affinity for apiserver pod assignment (overrides the preset)
  ##
  affinity: {}
  ## @param apiserver.podAnnotations Annotations for apiserver pods
  ##
  podAnnotations: {}
  ## @param apiserver.extraEnvVars Extra environment variables for the apiserver container
  ##
  extraEnvVars: []
  ## Aggregated apiserver Pod Disruption Budget
  ##
  pdb:
    ## @param apiserver.pdb.create Enable a Pod Disruption Budget for the apiserver
    ##
    create: true
    ## @param apiserver.pdb.minAvailable Minimum number/percentage of apiserver pods that should remain scheduled
    ##
    minAvailable: 1
    ## @param apiserver.pdb.maxUnavailable Maximum number/percentage of apiserver pods that may be made unavailable
    ##
    maxUnavailable: ""
  ## Aggregated apiserver ServiceAccount
  ##
  serviceAccount:
    ## @param apiserver.serviceAccount.create Create a dedicated ServiceAccount for the apiserver
    ##
    create: true
    ## @param apiserver.serviceAccount.name Name of the apiserver ServiceAccount (generated if empty)
    ##
    name: ""
    ## @param apiserver.serviceAccount.automountServiceAccountToken Automount the apiserver ServiceAccount token
    ##
    automountServiceAccountToken: true
  ## Bundled etcd backing store for the aggregated apiserver. This etcd is owned by
  ## kubetron and isolated to the release namespace. For a single-node control plane keep
  ## replicaCount at 1; set 3 (or 5) for a highly available quorum.
  ##
  etcd:
    ## @param apiserver.etcd.replicaCount Number of etcd replicas (use an odd number: 1, 3 or 5)
    ##
    replicaCount: 1
    ## @param apiserver.etcd.image.registry [default: REGISTRY_NAME] etcd image registry
    ## @param apiserver.etcd.image.repository [default: REPOSITORY_NAME/etcd] etcd image repository
    ## @param apiserver.etcd.image.tag etcd image tag
    ## @param apiserver.etcd.image.digest etcd image digest in the way sha256:aa.... Overrides the tag if set.
    ## @param apiserver.etcd.image.pullPolicy etcd image pull policy
    ##
    image:
      registry: quay.io
      repository: coreos/etcd
      tag: v3.5.16
      digest: ""
      pullPolicy: IfNotPresent
    ## @param apiserver.etcd.resourcesPreset Set etcd container resources according to one common preset. Ignored if `apiserver.etcd.resources` is set.
    ## @param apiserver.etcd.resources Set etcd container requests and limits
    ##
    resourcesPreset: "small"
    resources: {}
    ## etcd persistence
    ##
    persistence:
      ## @param apiserver.etcd.persistence.enabled Enable persistence for etcd using a PersistentVolumeClaim. Disable to use an emptyDir (NOT recommended: claims are lost on pod restart).
      ##
      enabled: true
      ## @param apiserver.etcd.persistence.storageClass Storage class for the etcd PVC. Set to "-" to disable dynamic provisioning.
      ##
      storageClass: ""
      ## @param apiserver.etcd.persistence.size Size of the etcd PVC
      ##
      size: 8Gi
      ## @param apiserver.etcd.persistence.accessModes Access modes for the etcd PVC
      ##
      accessModes:
        - ReadWriteOnce
      ## @param apiserver.etcd.persistence.annotations Annotations for the etcd PVC
      ##
      annotations: {}
    ## @param apiserver.etcd.nodeSelector Node labels for etcd pod assignment
    ##
    nodeSelector:
      kubernetes.io/os: linux
    ## @param apiserver.etcd.tolerations Tolerations for etcd pod assignment
    ##
    tolerations: []
