apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-scripts" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  # Replaces /usr/local/bin/dind from the image, which the image's entrypoint runs before
  # dockerd whenever that file exists. It is the upstream script with one block removed:
  # "cgroup v2: enable nesting", which creates /sys/fs/cgroup/init, moves every process out of
  # the root cgroup into it and writes the root's cgroup.subtree_control. That is correct when
  # /sys/fs/cgroup is the container's own cgroup. Here it is not - the daemon runs in the node's
  # cgroup namespace (and the chart mounts the node's hierarchy on top) - so the block acted
  # on the node's root cgroup, moving the node's kernel threads into a new "init" cgroup that
  # outlives the release. Nothing in this chart needs nesting: containers are placed in
  # cgroups by the node's containerd and runc, not by this daemon.
  dind: |-
    #!/bin/sh
    set -e

    # Tell dockerd it is inside a container, which it uses for AppArmor detection.
    export container=docker

    if [ -d /sys/kernel/security ] && ! mountpoint -q /sys/kernel/security; then
    	mount -t securityfs none /sys/kernel/security || {
    		echo >&2 'Could not mount /sys/kernel/security.'
    		echo >&2 'AppArmor detection and --privileged mode might break.'
    	}
    fi

    if ! mountpoint -q /tmp; then
    	mount -t tmpfs none /tmp
    fi

    # (upstream "cgroup v2: enable nesting" block intentionally omitted - see above)

    mount --make-rshared /

    if [ $# -gt 0 ]; then
    	exec "$@"
    fi

    echo >&2 'ERROR: No command specified.'
    exit 1
  {{- if and .Values.tcp.enabled .Values.tcp.tls.enabled .Values.tcp.tls.existingCASecret }}
  # Issues this node's server certificate for the TCP listener from the CA in
  # tcp.tls.existingCASecret. Runs on every pod start, so certificates never outlive a
  # rollout and a node added later is covered without reissuing anything. Only the issued
  # certificate and key reach the daemon; the CA key stays in this init container.
  issue-tls-cert.sh: |-
    #!/bin/sh
    set -eu
    out=/etc/docker/tls
    work=$(mktemp -d)
    trap 'rm -rf "$work"' EXIT
    san="IP:${NODE_IP},DNS:${NODE_NAME}"
    {{- if .Values.tcp.bindAddress }}
    san="${san},IP:{{ .Values.tcp.bindAddress }}"
    {{- end }}
    {{- range .Values.tcp.tls.extraSANs }}
    san="${san},{{ . }}"
    {{- end }}
    printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=%s\n' "$san" > "$work/ext.cnf"
    openssl ecparam -name prime256v1 -genkey -noout -out "$work/tls.key"
    openssl req -new -key "$work/tls.key" -subj "/CN=${NODE_NAME}" -out "$work/tls.csr"
    openssl x509 -req -in "$work/tls.csr" -CA /tls-ca/ca.crt -CAkey /tls-ca/ca.key \
      -set_serial "0x$(openssl rand -hex 16)" -days {{ .Values.tcp.tls.certValidityDays }} \
      -extfile "$work/ext.cnf" -out "$work/tls.crt"
    openssl verify -CAfile /tls-ca/ca.crt "$work/tls.crt" >/dev/null
    install -m 0644 /tls-ca/ca.crt "$out/ca.crt"
    install -m 0644 "$work/tls.crt" "$out/tls.crt"
    install -m 0600 "$work/tls.key" "$out/tls.key"
    echo "issued server certificate for ${NODE_NAME} with SAN ${san}"
  {{- end }}
