description: kubetron is a thin K8s-to-Neutron/Octavia orchestration layer that gives
  standard, unmodified Kubernetes/Helm workloads a VM-like persistent network identity
  on OpenStack OVN tenant networks. It reconciles NetworkPortClaims into Neutron ports,
  injects Multus attachments via an admission webhook, and (optionally) serves claims
  from its own aggregated apiserver.
