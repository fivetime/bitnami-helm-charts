{{- if and .Values.sharedResources.create .Values.crds.install }}
apiVersion: {{ include "common.capabilities.crd.apiVersion" . }}
kind: CustomResourceDefinition
metadata:
  name: networkportpools.kubetron.network.kubevirt.io
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  group: kubetron.network.kubevirt.io
  names:
    kind: NetworkPortPool
    listKind: NetworkPortPoolList
    plural: networkportpools
    shortNames:
    - npp
    singular: networkportpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.network
      name: Network
      type: string
    - jsonPath: .spec.size
      name: Size
      type: integer
    - jsonPath: .status.warming
      name: Warming
      type: integer
    - jsonPath: .status.available
      name: Available
      type: integer
    - jsonPath: .status.allocated
      name: Allocated
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkPortPool pre-creates a pool of Neutron ports (as slot
          NetworkPortClaims) so FaaS/Serverless pods skip the port-create wait on the
          hot path. Pods consume a slot via the PortPoolAnnotation; deletion recycles
          the slot back to the pool (DESIGN-warm-pool.md).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetworkPortPoolSpec sizes a warm pool of pre-created Neutron ports for
              short-lived workloads (Serverless/FaaS, DESIGN-warm-pool §3). A pool binds
              exactly ONE network — whether that network is tenant-isolated or a shared
              provider net is the application's choice, not kubetron's policy (§4.6).
            properties:
              credentialSecretRef:
                description: |-
                  CredentialSecretRef names the Secret (same namespace) with the OpenStack
                  application credential owning the slot ports (same keys as claims).
                type: string
              dnsNameservers:
                description: DNSNameservers is copied to slot claims (full pods run
                  dnsPolicy:None).
                items:
                  type: string
                type: array
              network:
                description: |-
                  Network is the Neutron network (≈VPC) name or id every slot port is
                  created on, resolved with the tenant credential.
                type: string
              reclaimPolicy:
                default: Delete
                description: |-
                  ReclaimPolicy is stamped onto slot claims. Pools default to Delete —
                  slot ports are pool-owned elastic capacity, not persistent identity;
                  deleting the pool (or scaling down) releases their IPs.
                enum:
                - Retain
                - Delete
                type: string
              size:
                description: |-
                  Size is the desired number of slot ports (Deployment-replicas style: the
                  controller converges toward it; scale-down removes only free slots).
                format: int32
                minimum: 0
                type: integer
            required:
            - credentialSecretRef
            - network
            - size
            type: object
          status:
            description: |-
              NetworkPortPoolStatus is controller-filled (status subresource).
              Slot accounting: total = warming + available + allocated.
            properties:
              allocated:
                description: Allocated counts slots currently held by pods.
                format: int32
                type: integer
              available:
                description: Available counts Bound, unallocated slots — immediately
                  consumable.
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              total:
                description: Total is the number of slot claims that currently exist.
                format: int32
                type: integer
              warming:
                description: |-
                  Warming counts slots whose claim is not Bound yet (port still being
                  created in Neutron) — not yet consumable.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
